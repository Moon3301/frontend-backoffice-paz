<header class="paz-header bg-paz-header">
    <div class="flex align-items-center gap-3">
        <button pButton pRipple type="button" icon="pi pi-bars" class="p-button-text p-button-rounded text-pure-white"
                (click)="toggleMenu()" aria-label="Abrir menú"></button>
        <a routerLink="/home" class="flex align-items-center gap-2 no-underline text-pure-white" aria-label="Ir al inicio">
            <span class="paz-header-logo"><img src="/images/logo-paz.png" alt="" /></span>
            <span class="font-bold text-lg hidden sm:inline">Backoffice</span>
        </a>
    </div>

    <div class="flex align-items-center gap-2">
        <app-theme-toggle customClass="text-pure-white"></app-theme-toggle>

        <ng-container *ngIf="perfil$ | async as perfil">
            <div class="paz-header-usuario">
                <span class="paz-avatar paz-header-avatar">{{ iniciales(perfil.nombre) }}</span>
                <div class="hidden md:block line-height-2">
                    <div class="font-semibold text-sm">{{ perfil.nombre }}</div>
                    <div class="text-xs opacity-70">{{ rolEtiqueta[perfil.rol] }}</div>
                </div>
            </div>
            <button pButton pRipple type="button" icon="pi pi-sign-out"
                    class="p-button-text p-button-rounded text-pure-white"
                    pTooltip="Cerrar sesión" tooltipPosition="bottom"
                    (click)="logout()" aria-label="Cerrar sesión"></button>
        </ng-container>
    </div>
</header>
