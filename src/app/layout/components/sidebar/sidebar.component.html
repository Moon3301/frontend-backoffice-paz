<p-sidebar [(visible)]="sidebarVisible" (onHide)="onHide()" [showCloseIcon]="true" position="left" styleClass="w-20rem">

    <ng-template pTemplate="header">
        <div class="flex align-items-center gap-2 font-bold text-lg text-paz-primary">
            <span class="flex align-items-center justify-content-center border-round"
                  style="width: 36px; height: 36px; background: var(--paz-brand);">
                <img src="/images/logo-paz.png" alt="" style="width: 30px;">
            </span>
            Backoffice PAZ
        </div>
    </ng-template>

    <nav class="flex flex-column gap-1 mt-2" aria-label="Menú principal">
        <a routerLink="/home" routerLinkActive="activo" class="paz-nav-link" (click)="navegar()">
            <i class="pi pi-home"></i><span>Inicio</span>
        </a>

        <ng-container *ngIf="modulosVisibles.length">
            <div class="paz-nav-seccion">Módulos</div>
            <a *ngFor="let m of modulosVisibles" [routerLink]="m.ruta" routerLinkActive="activo" class="paz-nav-link" (click)="navegar()">
                <i [class]="m.icono"></i><span>{{ m.nombre }}</span>
            </a>
        </ng-container>

        <ng-container *ngIf="perfil?.rol === 'admin'">
            <div class="paz-nav-seccion">Administración</div>
            <a routerLink="/usuarios" routerLinkActive="activo" class="paz-nav-link" (click)="navegar()">
                <i class="pi pi-shield"></i><span>Usuarios y permisos</span>
            </a>
        </ng-container>

        <hr class="w-full border-top-1 border-none surface-border my-3">

        <a role="button" tabindex="0" class="paz-nav-link peligro" (click)="logout()" (keyup.enter)="logout()">
            <i class="pi pi-sign-out"></i><span>Cerrar sesión</span>
        </a>
    </nav>

</p-sidebar>
