<div class="w-full">

    [migas]="['Copropiedad']"
    subtitulo="Envío del Reglamento de Copropiedad al promesar (FIORI).">
  </app-page-header>

  <!-- Tabs -->
  <p-tabs [value]="activeTab">
    <p-tablist>
      <p-tab [value]="0">

      </p-tab>
      <p-tab [value]="1">
        <i class="pi pi-history mr-2"></i> Historial
      </p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel [value]="0">
        <app-gestion-campana></app-gestion-campana>
      </p-tabpanel>
      <p-tabpanel [value]="1">
        <app-historial-envios></app-historial-envios>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

</div>
