<div class="w-full">

  <!-- Encabezado / breadcrumb -->
  <div class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3 mb-4">
    <div>
      <div class="flex align-items-center gap-2 text-sm text-500 mb-1">
        <span>Inicio</span>
        <span>/</span>
        <span class="text-paz-primary font-medium">Gestión de Copropiedad</span>
      </div>
      <div class="text-2xl font-bold text-900">Reglamento de Copropiedad</div>
      <p class="text-500 text-sm m-0 mt-1">Envío del Reglamento de Copropiedad al promesar (FIORI).</p>
    </div>
  </div>

  <!-- Tabs -->
  <p-tabs [value]="activeTab">
    <p-tablist>
      <p-tab [value]="0">
        <i class="pi pi-megaphone mr-2"></i> Gestión de Campañas
      </p-tab>
      <p-tab [value]="1">
        <i class="pi pi-history mr-2"></i> Historial
      </p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel [value]="0">
        <app-gestion-campana></app-gestion-campana>
      </p-tabpanel>
      <p-tabpanel [value]="1">
        <app-historial-envios></app-historial-envios>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

</div>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
